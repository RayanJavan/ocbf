[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocbf"
version = "0.1.0"
description = "Object-Centric Belief Fusion: versioned evidence, explicit probability models, and uncertainty-aware process queries"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
oracles = ["gtsam>=4.2"]
dev = ["pytest>=8.0", "hypothesis>=6.100", "matplotlib>=3.8"]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7,<9.8",
    # mkdocstrings formats rendered signatures with Ruff when it is importable and leaves
    # them on one long line when it is not, so the `line_length` setting in mkdocs.yml is
    # inert without it -- and the site would render differently in CI than on a developer
    # machine that happens to have Ruff installed.
    "ruff>=0.16.6,<0.17",
    "mkdocstrings[python]>=1.0.6,<1.1",
    "mkdocstrings-python>=2.0.8,<2.1",
    "pymdown-extensions>=11.0.2,<11.1",
    "mkdocs-gen-files>=0.6.1,<0.7",
    "mkdocs-literate-nav>=0.6.3,<0.7",
    "mkdocs-llmstxt>=0.5.0,<0.6",
    "mkdocs-redirects>=1.2.3,<1.3",
]

[project.urls]
Documentation = "https://ocbf.readthedocs.io/"
Source = "https://github.com/RayanJavan/ocbf"
Issues = "https://github.com/RayanJavan/ocbf/issues"

[tool.setuptools.packages.find]
include = ["ocbf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running end-to-end checks"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

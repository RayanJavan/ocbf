[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocbf"
version = "0.1.0"
description = "Object-Centric Belief Fusion: joint probabilistic belief over an OCEL 2.0 log fused from many sparse, unreliable sources"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
inference = ["torch>=2.4"]
bayes = ["pymc>=5.16", "arviz>=0.18"]
oracles = ["pyagrum>=1.13", "gtsam>=4.2", "problog>=2.2"]
io = ["pm4py>=2.7"]
dev = ["pytest>=8.0", "hypothesis>=6.100", "matplotlib>=3.8"]
docs = [
    "mkdocs-material>=9.5",
    # mkdocstrings formats rendered signatures with Ruff when it is importable and leaves
    # them on one long line when it is not, so the `line_length` setting in mkdocs.yml is
    # inert without it -- and the site would render differently in CI than on a developer
    # machine that happens to have Ruff installed.
    "ruff>=0.6",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-llmstxt>=0.1",
]

[tool.setuptools.packages.find]
include = ["ocbf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running end-to-end checks"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Hosting adapter; content, theme, plugins and API generation live in mkdocs.yml.
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - python -m pip install -r requirements/docs.txt -e ".[docs]"
      - python -m pip check
    pre_build:
      - python -m unittest discover -s scripts/tests -v
      - python scripts/check_docs.py
    post_build:
      - python scripts/check_docs.py --site-dir "$READTHEDOCS_OUTPUT/html"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

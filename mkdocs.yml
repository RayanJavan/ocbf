site_name: OCBF
site_description: >-
  Object-Centric Belief Fusion: versioned evidence, explicit probability models,
  and uncertainty-aware process queries.
# Optional host-independent override, then RTD's version URL, then local preview.
site_url: !ENV [DOCS_SITE_URL, READTHEDOCS_CANONICAL_URL, "http://127.0.0.1:8000/"]
repo_url: https://github.com/RayanJavan/ocbf
repo_name: RayanJavan/ocbf
edit_uri: edit/main/docs/
strict: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - First assessment: getting-started/quickstart.md
  - Concepts:
      - concepts/index.md
      - Semantic context: concepts/semantics.md
      - Evidence and observations: concepts/evidence.md
      - Parameters and trust: concepts/parameters.md
      - Models and constraints: concepts/model.md
      - Inference and posteriors: concepts/inference.md
      - Queries and result meaning: concepts/queries.md
      - Revisions and execution: concepts/execution.md
  - How-to guides:
      - how-to/index.md
      - Evidence and assumptions:
          - Interpret evidence: how-to/interpret-evidence.md
          - Revise evidence: how-to/revise-evidence.md
          - Configure manual trust: how-to/configure-trust.md
          - Configure constraints: how-to/configure-constraints.md
      - Inference and results:
          - Choose inference: how-to/choose-inference.md
          - Use joint inference: how-to/joint-inference.md
          - Evaluate queries: how-to/evaluate-queries.md
          - Read diagnostics: how-to/read-diagnostics.md
      - Execution and retention:
          - Reuse sessions: how-to/reuse-sessions.md
          - Warm-start sampling: how-to/warm-start.md
          - Bound execution: how-to/bound-execution.md
          - Export and replay: how-to/export-replay.md
      - Integrate and extend:
          - Integrate an application: how-to/integrate-application.md
          - Mammut retrospective: how-to/mammut-retrospective.md
          - Extend OCBF: how-to/extend.md
  - Reference:
      - reference/index.md
      - Capabilities and limitations: reference/capabilities.md
      - Configuration and errors: reference/configuration.md
      - Results and interchange: reference/results.md
      - Glossary: reference/glossary.md
      - API: reference/api/
  - Development:
      - development/index.md
      - Architecture: development/architecture.md
      - Validation: development/validation.md
      - Documentation maintenance: development/documentation.md
      - Documentation hosting: development/hosting.md

theme:
  name: material
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.code.annotate
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  # Moved pages keep their old URLs; anchors within a moved page are not redirected.
  - redirects:
      redirect_maps:
        overview/workflow.md: concepts/index.md
        integrations/index.md: how-to/integrate-application.md
        integrations/mammut.md: how-to/mammut-retrospective.md
        development/extensions.md: how-to/extend.md
        how-to/repeated-execution.md: how-to/reuse-sessions.md
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
          options:
            docstring_style: google
            docstring_section_style: table
            merge_init_into_class: true
            show_if_no_docstring: true
            heading_level: 2
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            inherited_members: false
            members_order: source
            filters: ["!^_"]
            summary: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            line_length: 88
            show_source: true
            show_labels: true
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        OCBF is a modular Python library for versioned evidence, explicit probability
        models, qualified posterior capabilities, and object-centric process queries.
      sections:
        Overview:
          - index.md
        Getting started:
          - getting-started/*.md
        Concepts:
          - concepts/*.md
        How-to guides:
          - how-to/*.md
        Reference:
          - reference/*.md
          - reference/api/ocbf/**/*.md
          - reference/api/ocbf.md
        # llms.txt convention: readers may skip this section when context is short.
        Optional:
          - development/*.md

extra_css:
  - stylesheets/extra.css
watch:
  - ocbf
  - examples
  - scripts

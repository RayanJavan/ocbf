# The two gates the README names, run on every push and pull request.
#
# They are separate jobs on purpose: the library suite and the documentation build fail for
# unrelated reasons, and a red check should say which one without anyone opening the log.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant, so cancel it.
# Runs on main are exempt: its history is the record of what actually passed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  tests:
    name: Test suite (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 3.12 is the floor declared in pyproject.toml, and testing the floor is what
          # catches a dependency that has quietly moved past it.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # GTSAM is not installed here. tests/test_gtsam_oracle.py skips its oracle checks
      # when the backend is absent and still runs the plumbing tests, which is the point.
      - name: Run tests
        run: python -m pytest -q

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Install the library and source-inspection documentation toolchain together.
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"

      - name: Check documentation sources and examples
        run: python scripts/check_docs.py

      # Strict mode promotes broken navigation, links and reference warnings to failures.
      - name: Build site
        run: mkdocs build --strict
        # Suppresses a long unsolicited advisory the mkdocs-material build prints.
        env:
          DISABLE_MKDOCS_2_WARNING: "true"

      - name: Check published content
        run: python scripts/check_docs.py --site-dir site

      # Deliver the generated site through the existing CI artifact.
      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: ocbf-site
          path: site/
          retention-days: 14
